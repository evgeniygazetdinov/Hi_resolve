services:
  hi-resolve:
    build:
      context: .
    container_name: hi-resolve
    restart: unless-stopped
    # Linux: Ollama on the host binds 127.0.0.1 only, so the app must share the host network.
    network_mode: host
    env_file:
      - .env
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://127.0.0.1:11434/api/generate}
      QDRANT_URL: ${QDRANT_URL:-http://127.0.0.1:6333}
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
